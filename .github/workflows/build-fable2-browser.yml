name: Build Fable2 Asset Browser (Windows)
on:
  push:
    branches:
      - tools/fable2-asset-browser-win-build
      - tools/fable2-asset-browser-ultralight-v2
      - tools/fable2-asset-browser-mobile-only-v3
      - tools/fable2-asset-browser-unity-navigation-v4
      - tools/fable2-asset-browser-natural-left-drag-v5
    paths:
      - .github/workflows/build-fable2-browser.yml
      - tools/fable2-browser/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Check out open-source Fable2 Asset Browser
        shell: pwsh
        run: git clone --depth=1 https://github.com/adarec1994/Fable2AssetBrowser.git fable-src
      - name: Apply source modifications
        shell: pwsh
        run: |
          $patchBase64 = (Get-Content -LiteralPath 'tools/fable2-browser/fable_patch.b64' -Raw).Trim()
          [System.IO.File]::WriteAllBytes('fable_patch.zip', [Convert]::FromBase64String($patchBase64))
          Expand-Archive -LiteralPath 'fable_patch.zip' -DestinationPath 'fable-patch' -Force
          python fable-patch/applica_modifica.py fable-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enable automatic mobile GLB optimization
        shell: pwsh
        run: |
          python tools/fable2-browser/enable_mobile_export.py fable-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mobile-only default with stronger image optimization
        shell: pwsh
        run: |
          python tools/fable2-browser/mobile_only_v3.py fable-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enable Unity-style level viewport navigation
        shell: pwsh
        run: |
          python tools/fable2-browser/enable_unity_flycam.py fable-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fix inverted left mouse drag direction
        shell: pwsh
        run: |
          python tools/fable2-browser/fix_left_drag.py fable-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure MSVC x64 Release
        shell: pwsh
        run: |
          cmake -S fable-src/source -B fable-build -G "Visual Studio 17 2022" -A x64 -DFABLE_BUILD_TESTS=OFF -DFABLE_BUILD_TOOLS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows EXE
        shell: pwsh
        run: |
          cmake --build fable-build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download pinned gltfpack Windows optimizer
        shell: pwsh
        run: |
          $url = 'https://github.com/zeux/meshoptimizer/releases/download/v1.3/gltfpack-windows.zip'
          Invoke-WebRequest -Uri $url -OutFile 'gltfpack-windows.zip'
          Expand-Archive -LiteralPath 'gltfpack-windows.zip' -DestinationPath 'gltfpack-bin' -Force
          $gltfpack = Get-ChildItem 'gltfpack-bin' -Filter 'gltfpack.exe' -File -Recurse | Select-Object -First 1
          if (-not $gltfpack) { throw 'gltfpack.exe missing in release archive.' }
          Copy-Item -LiteralPath $gltfpack.FullName -Destination 'gltfpack.exe'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/zeux/meshoptimizer/v1.3/LICENSE.md' -OutFile 'meshoptimizer_LICENSE.md'
      - name: Package executable and license
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'fable-build' -Filter 'Fable_2_Asset_Browser.exe' -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Windows EXE was not generated.' }
          New-Item -ItemType Directory -Force 'Fable2AssetBrowser_MouseNaturale_Windows' | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/Fable_2_Asset_Browser.exe'
          Copy-Item -LiteralPath 'gltfpack.exe' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/gltfpack.exe'
          Copy-Item -LiteralPath 'meshoptimizer_LICENSE.md' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/meshoptimizer_LICENSE.md'
          Copy-Item -LiteralPath 'fable-src/LICENSE' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/LICENSE.txt'
          Copy-Item -LiteralPath 'fable-patch/applica_modifica.py' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/applica_modifica.py'
          Copy-Item -LiteralPath 'tools/fable2-browser/enable_mobile_export.py' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/enable_mobile_export.py'
          Copy-Item -LiteralPath 'tools/fable2-browser/mobile_only_v3.py' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/mobile_only_v3.py'
          Copy-Item -LiteralPath 'tools/fable2-browser/enable_unity_flycam.py' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/enable_unity_flycam.py'
          Copy-Item -LiteralPath 'tools/fable2-browser/fix_left_drag.py' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/fix_left_drag.py'
          Copy-Item -LiteralPath 'fable-src/source/src/UI/Layout/RenderPanel/DirectX/ModelView/Interaction/SkeletonCameraAndRender.inl' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/source/src/UI/Layout/RenderPanel/DirectX/ModelView/Interaction/SkeletonCameraAndRender.inl' -Force
          Copy-Item -LiteralPath 'tools/fable2-browser/Ottimizza-GLB.ps1' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/Ottimizza-GLB.ps1'
          Copy-Item -LiteralPath 'tools/fable2-browser/OTTIMIZZA_I_MIEI_GLB.bat' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/OTTIMIZZA_I_MIEI_GLB.bat'
          Copy-Item -LiteralPath 'fable-patch/source' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/source' -Recurse
          Copy-Item -LiteralPath 'fable-src/source/src/UI/Panels/LeftPanel/Draw/Assets/ModelOrganizer.inl' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/source/src/UI/Panels/LeftPanel/Draw/Assets/ModelOrganizer.inl' -Force
          Copy-Item -LiteralPath 'fable-src/source/src/ISO/IsoDump/Models/MobileOptimizer.inl' -Destination 'Fable2AssetBrowser_MouseNaturale_Windows/source/src/ISO/IsoDump/Models/MobileOptimizer.inl'
          @'
          Fable 2 Asset Browser - Windows x64 Release (modificato)
          Include: selezione multipla, frecce, categorie e selezione GLB/FBX/MDL.
          FIX: tasto sinistro + trascinamento naturale (mouse non invertito).
          Nel pannello del modello si possono invertire X e Y separatamente.
          NOVITA: navigazione libera nelle scene Levels come Unity.
          WASD / frecce: spostamento anche negli interni del castello.
          Mouse destro tenuto: ruota la visuale. Q/E: giu/su.
          Shift: movimento veloce, F: centra la scena, rotella: velocita.
          Opzione Fly navigation nella scena per passare da navigazione a editing.
          NOVITA: di default ogni export GLB produce SOLO *_mobile.glb leggero.
          Compressione meshopt + WebP + riduzione texture 50%, triangoli 85%.
          Preset Qualita alta, Mobile, Ultra (texture 25%, triangoli 65%).
          Facoltativo: "Salva anche originale pesante". In caso di errore,
          conserva un GLB originale anziche' perdere l'asset.
          Per i vecchi GLB giganti, trascina la cartella su OTTIMIZZA_I_MIEI_GLB.bat
          e recupera i modelli nella cartella GLB_MOBILE_OTTIMIZZATI.
          Lascia gltfpack.exe accanto al programma. Il file originale resta intatto.
          I file *_mobile.glb richiedono EXT_meshopt_compression e EXT_texture_webp
          nel loader del gioco. In Three.js configurare GLTFLoader.setMeshoptDecoder.
          La riduzione non e' garantita: dipende dai dati, non elimina automaticamente
          porte/finestre e non alleggerisce collisioni del motore di gioco.
          Licenza gltfpack/meshoptimizer: MIT, vedi meshoptimizer_LICENSE.md.
          Questo EXE e' basato sul progetto GPL-3.0 adarec1994/Fable2AssetBrowser.
          Il codice delle modifiche e' incluso; il sorgente originale: https://github.com/adarec1994/Fable2AssetBrowser
          Non include asset del gioco. Conservare sempre una copia del vecchio EXE.
          '@ | Set-Content -LiteralPath 'Fable2AssetBrowser_MouseNaturale_Windows/LEGGIMI.txt'
          Write-Host "Built:" $exe.FullName $exe.Length
      - name: Upload installer-free Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Fable2AssetBrowser_MouseNaturale_Windows
          path: Fable2AssetBrowser_MouseNaturale_Windows/
          retention-days: 14
