name: Secure dependency refresh (isolated)

on:
  push:
    branches: [security/documio-next-upgrade-20261015]
    paths: [.github/workflows/secure-deps-refresh.yml]

permissions:
  contents: write

concurrency:
  group: documio-secure-next-upgrade
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/documio-next-upgrade-20261015
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Upgrade affected dependencies with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact next@16.4.1 --no-fund --no-audit \
            --fetch-retries=5 --fetch-retry-mintimeout=1000 \
            --fetch-retry-maxtimeout=12000 --fetch-timeout=90000 --prefer-offline
          npm audit fix --no-fund --no-audit \
            --fetch-retries=4 --fetch-retry-mintimeout=1000 \
            --fetch-retry-maxtimeout=12000 --fetch-timeout=90000 --prefer-offline
      - name: Security audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json --fetch-retries=3 --fetch-timeout=45000 > audit.json || true
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const a=JSON.parse(readFileSync("audit.json", "utf8"));
            const stats=a.metadata?.vulnerabilities;
            if(!stats) throw new Error("Cannot confirm audit result");
            console.log("Dependency advisory counts:", JSON.stringify(stats));
            if((stats.critical??0)>0 || (stats.high??0)>0)
              throw new Error("High/critical vulnerabilities remain");
          '
          rm -f audit.json
      - name: Test finance
        run: npm run test:finance
      - name: Test archive
        run: npm run test:archive
      - name: Typecheck and build
        run: npm run build
      - name: Commit verified dependency manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: patch Next.js and vulnerable dependencies"
            git push origin HEAD:refs/heads/security/documio-next-upgrade-20261015
          fi
