name: Build check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Summarize dependency advisories
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync("audit-report.json", "utf8"));
            const vulnerabilities = data.metadata?.vulnerabilities;
            if (!vulnerabilities) throw new Error("Dependency audit could not be verified");
            console.log("Severity summary:", JSON.stringify(vulnerabilities));
            if ((vulnerabilities.critical ?? 0) > 0 || (vulnerabilities.high ?? 0) > 0)
              throw new Error("High or critical dependency vulnerabilities must be fixed before release");
            for (const [name,entry] of Object.entries(data.vulnerabilities ?? {})) {
              const items = (entry.via ?? []).filter((x)=>typeof x==="object")
                .map((x)=>x.title).slice(0,3);
              console.log(name, entry.severity, "fix:",JSON.stringify(entry.fixAvailable), items.join(" | "));
            }
          '
          rm -f audit-report.json
      - name: Financial-control unit tests
        run: npm run test:finance
      - name: ZIP invoice import regression tests
        run: npm run test:invoice-zip
      - name: Archive and fast-upload regression tests
        run: npm run test:archive
      - name: Responsive UI regression tests
        run: npm run test:ui
      - name: Business and company isolation regression tests
        run: npm run test:business
      - name: Supplier classification and SHA deduplication tests
        run: npm run test:suppliers
      - name: Professional studio permissions and workflow tests
        run: npm run test:professionals
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documio-build-log
          path: build.log
          if-no-files-found: ignore
