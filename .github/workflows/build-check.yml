name: Build check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Summarize dependency advisories
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync("audit-report.json", "utf8"));
            const vulnerabilities = data.metadata?.vulnerabilities;
            if (!vulnerabilities) throw new Error("Dependency audit could not be verified");
            console.log("Severity summary:", JSON.stringify(vulnerabilities));
            if ((vulnerabilities.critical ?? 0) > 0 || (vulnerabilities.high ?? 0) > 0)
              throw new Error("High or critical dependency vulnerabilities must be fixed before release");
            for (const [name,entry] of Object.entries(data.vulnerabilities ?? {})) {
              const items = (entry.via ?? []).filter((x)=>typeof x==="object")
                .map((x)=>x.title).slice(0,3);
              console.log(name, entry.severity, "fix:",JSON.stringify(entry.fixAvailable), items.join(" | "));
            }
          '
          rm -f audit-report.json
      - name: Financial-control unit tests
        run: npm run test:finance
      - name: ZIP invoice import regression tests
        run: npm run test:invoice-zip
      - name: Archive and fast-upload regression tests
        run: npm run test:archive
      - name: Responsive UI regression tests
        run: npm run test:ui
      - name: Business and company isolation regression tests
        run: npm run test:business
      - name: Supplier classification and SHA deduplication tests
        run: npm run test:suppliers
      - name: Professional studio permissions and workflow tests
        run: npm run test:professionals
      - name: PostgreSQL RLS e migrazione studi professionali
        shell: bash
        run: |
          set -euo pipefail
          pg_id="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2=="postgres:17"{print $1;exit}')"
          test -n "$pg_id"
          cat scripts/professional-db-setup.sql \
              supabase/migrations/20261018_professional_studios.sql \
              scripts/professional-db-rls.sql | \
              docker exec -i "$pg_id" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres
      - name: Studio client documents and verified-sources unit tests
        run: npm run test:professional-documents
      - name: Per-client RLS PostgreSQL, isolated from production
        shell: bash
        run: |
          set -euo pipefail
          pg_id="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2=="postgres:17"{print $1;exit}')"
          test -n "$pg_id"
          docker exec "$pg_id" createdb -U postgres documio_acl_ci
          { sed '/^create role /d' scripts/professional-db-setup.sql
            cat supabase/migrations/20261018_professional_studios.sql
            cat scripts/professional-storage-test-schema.sql
            cat supabase/migrations/20261018_professional_client_documents.sql
            cat scripts/professional-client-acl-rls.sql
          } | docker exec -i "$pg_id" psql -X -v ON_ERROR_STOP=1 -U postgres -d documio_acl_ci
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documio-build-log
          path: build.log
          if-no-files-found: ignore
